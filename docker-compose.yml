# ── TaskflowAI — Docker Compose ───────────────────────────────────────────────
# Spins up the full stack: MongoDB + Express API + Next.js Web
#
# Usage:
#   docker-compose up --build        # Build and start all services
#   docker-compose up -d             # Start in background
#   docker-compose down              # Stop and remove containers
#   docker-compose logs -f server    # Follow server logs
#
# Environment variables:
#   Copy .env.example → .env in /server and fill in your values.
#   Or set them directly in this file under `environment:`.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taskflowai
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Express API Server ─────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: taskflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/taskflowai
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_strong_random_secret}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLIENT_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js Web App ────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_URL: http://server:5000
    container_name: taskflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://server:5000

volumes:
  mongo_data:
    driver: local
